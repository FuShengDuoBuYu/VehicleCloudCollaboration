version: 1

camera:
  index: 0
  width: 640
  height: 480
  fps: 20
  # Pixel-orientation correction only; physical pan/yaw must face forward.
  rotation_degrees: 0
  flip_horizontal: false
  flip_vertical: false
  # Enable only after verifying the target chassis PTZ linkage and center angle.
  gimbal:
    initialize_on_startup: false
    pan_angle: 90
    tilt_angle: null
    settle_time: 0.8
  startup_timeout: 10.0
  stale_timeout: 1.0

perception:
  mask_width: 320
  mask_height: 180

perspective:
  # Replace with car/autodrive/config/onboard_calibration.yaml after calibration.
  calibration: null

outer_loop:
  # Current runtime follows the fixed clockwise outer loop.
  enabled: true
  navigation_mode: boundary
  direction: clockwise
  outer_boundary_side: left
  # Measure this from fresh two-boundary fits after perspective calibration.
  # It is used only while one physical boundary is unavailable.
  expected_lane_width_ratio: 0.70
  minimum_lane_width_ratio: 0.42
  maximum_lane_width_ratio: 0.72
  adaptive_lane_width: false
  minimum_visible_boundary_ratio: 0.01
  include_lane_mask: false
  ego_boundary_top_ratio: 0.84
  ego_boundary_half_width_ratio: 0.14
  maximum_ego_yellow_ratio: 0.020
  green_hsv_lower: [45, 55, 35]
  green_hsv_upper: [105, 255, 255]
  green_lab_a_max: 118
  green_lab_b_min: 123
  green_close_kernel: 5
  green_dilate_kernel: 3

centerline:
  top_ratio: 0.48
  bottom_ratio: 0.94
  lookahead_ratio: 0.50
  tight_turn_lookahead_ratio: 0.72
  sample_count: 24
  minimum_width_ratio: 0.06
  route_hint_bias: 0.15

lcc:
  base_speed: 0.12
  min_confidence: 0.25
  lateral_gain: 0.72
  heading_gain: 0.92
  derivative_gain: 0.0
  steering_limit: 0.70
  steering_speed_gain: 0.55
  turn_slowdown: 0.42
  maximum_lateral_error: 0.35
  maximum_heading_error: 1.0
  steering_smoothing: 0.35
  tight_turn_near_heading_start: 0.40
  tight_turn_near_heading_full: 0.65

wheels:
  # Values below match the current chassis; recalibrate after hardware changes.
  drive_mode: four-wheel-trim
  pwm_limit: 35
  minimum_moving_pwm: 10
  front_left_base_pwm: 16
  rear_left_base_pwm: 16
  front_right_base_pwm: 20
  rear_right_base_pwm: 20
  front_steering_delta_pwm: 20
  maximum_steering_delta_pwm: 10
  tight_turn_start_steering: 0.50
  tight_turn_full_steering: 0.70
  tight_turn_outside_pwm: 30
  tight_turn_inside_pwm: 0
  transition_time: 0.25

safety:
  watchdog_timeout: 0.40
  watchdog_check_interval: 0.05
  maximum_inference_time: 0.25
  resume_valid_frames: 4
  resume_min_confidence: 0.35
  resume_maximum_lateral_jump: 0.32
  resume_maximum_heading_jump: 0.45
  resume_require_consistent_source: true
  corner_continuation:
    enabled: true
    enter_steering_threshold: 0.40
    exit_steering_threshold: 0.18
    exit_min_confidence: 0.35
    exit_valid_frames: 3
    maximum_hold_seconds: 8.00
    progress_timeout_seconds: 1.00
    minimum_heading_progress: 0.015
    minimum_lateral_progress: 0.010
    apex_trigger_factor: 0.50
    apex_near_heading_trigger: 0.40
    apex_commit_delay_seconds: 0.30
    minimum_apex_seconds: 0.55
    maximum_apex_seconds: 0.70
    apex_exit_near_heading: 0.30
    # Applied independently to near-heading and measured-pair confirmation.
    apex_exit_valid_frames: 2
    minimum_transverse_boundary_ratio: 0.01
    reacquire_steering_limit: 0.35
    tight_turn_factor_cap: 0.0

runtime:
  route_hint: left
  video_sample_every: 6
  output_dir: outputs/onboard_runtime
  save_latest_frame: true
  live_update_hz: 5
  console_update_hz: 4
  archive_runs: true
  archive_fps: 20
  archive_queue_frames: 32
  log_queue_rows: 256
  debug_queue_frames: 8
