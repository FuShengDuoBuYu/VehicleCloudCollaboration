# Copy this file and replace the points using a real onboard-camera frame.
# Point order: top-left, top-right, bottom-right, bottom-left.
# Coordinates are normalized, so x=1 and y=1 are the right/bottom image edges.
#
# Keep calibrated=false until the four source points have been measured.
calibrated: false
source_points:
  - [0.00, 0.00]
  - [1.00, 0.00]
  - [1.00, 1.00]
  - [0.00, 1.00]
destination_points:
  - [0.00, 0.00]
  - [1.00, 0.00]
  - [1.00, 1.00]
  - [0.00, 1.00]
