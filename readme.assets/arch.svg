<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">VehicleCloudCollaboration 车云协同闭环架构</title>
  <desc id="desc">车端摄像头、Donkey Car 自动驾驶、长尾检测、云端 Qwen3.5 9B 决策和车辆动作执行的闭环架构图。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f97316"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        fill: #172026;
      }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 24px; font-weight: 700; }
      .node-title { font-size: 22px; font-weight: 700; }
      .node-sub { font-size: 16px; fill: #4b5563; }
      .edge-label { font-size: 16px; font-weight: 700; }
      .small { font-size: 14px; fill: #4b5563; }
      .card { stroke-width: 3; }
      .flow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .flow-amber { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#arrow-amber); }
      .flow-orange { stroke: #f97316; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .dash-orange { stroke: #f97316; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-orange); }
      .dash-amber { stroke: #d97706; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-amber); }
      .label-bg { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; rx: 8; ry: 8; }
    </style>
  </defs>

  <rect width="1400" height="1020" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">VehicleCloudCollaboration 车云协同闭环架构</text>

  <!-- Car-side boundary -->
  <rect x="40" y="85" width="1320" height="695" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="70" y="125" class="section" fill="#1d4ed8">车端</text>

  <!-- Cloud boundary -->
  <rect x="40" y="810" width="1320" height="170" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="70" y="850" class="section" fill="#c2410c">云端</text>

  <!-- Main car-side loop -->
  <ellipse cx="520" cy="145" rx="135" ry="38" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="520" y="153" text-anchor="middle" class="node-title">车辆启动</text>

  <rect x="385" y="205" width="270" height="82" rx="10" fill="#ffffff" stroke="#2563eb" class="card"/>
  <text x="520" y="238" text-anchor="middle" class="node-title">初始化车辆状态</text>
  <text x="520" y="263" text-anchor="middle" class="node-sub">State = AUTO</text>

  <rect x="385" y="325" width="270" height="86" rx="10" fill="#e0f2fe" stroke="#0369a1" class="card"/>
  <text x="520" y="359" text-anchor="middle" class="node-title">摄像头采集</text>
  <text x="520" y="384" text-anchor="middle" class="node-sub">实时采集行驶画面帧</text>

  <rect x="385" y="455" width="270" height="98" rx="10" fill="#ffffff" stroke="#2563eb" class="card"/>
  <text x="520" y="491" text-anchor="middle" class="node-title">Donkey Car 自动驾驶</text>
  <text x="520" y="516" text-anchor="middle" class="node-sub">神经网络推理</text>
  <text x="520" y="538" text-anchor="middle" class="node-sub">输出转向/油门指令</text>

  <polygon points="520,590 675,650 520,710 365,650" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="520" y="658" text-anchor="middle" class="node-title">车辆状态判断</text>

  <rect x="80" y="610" width="260" height="88" rx="10" fill="#ffffff" stroke="#2563eb" class="card"/>
  <text x="210" y="646" text-anchor="middle" class="node-title">车辆正常行驶</text>
  <text x="210" y="672" text-anchor="middle" class="node-sub">执行 Donkey Car 指令</text>

  <rect x="385" y="725" width="270" height="78" rx="10" fill="#ffedd5" stroke="#f97316" class="card"/>
  <text x="520" y="758" text-anchor="middle" class="node-title">执行云端变道指令</text>
  <text x="520" y="782" text-anchor="middle" class="node-sub">lane-left / lane-right</text>

  <!-- Long-tail detection path -->
  <rect x="875" y="320" width="335" height="100" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="1042.5" y="356" text-anchor="middle" class="node-title">长尾场景检测脚本</text>
  <text x="1042.5" y="382" text-anchor="middle" class="node-sub">CLIP 语义检测 + YOLO 目标识别</text>
  <text x="1042.5" y="404" text-anchor="middle" class="node-sub">输出长尾分数</text>

  <polygon points="1042.5,465 1225,535 1042.5,605 860,535" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1042.5" y="543" text-anchor="middle" class="node-title">检测分数 ≥ 阈值?</text>

  <rect x="790" y="645" width="275" height="78" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="927.5" y="677" text-anchor="middle" class="node-title">修改车辆状态</text>
  <text x="927.5" y="702" text-anchor="middle" class="node-sub">State = BRAKE</text>

  <rect x="1110" y="645" width="250" height="78" rx="10" fill="#fef3c7" stroke="#d97706" class="card"/>
  <text x="1235" y="677" text-anchor="middle" class="node-title">保持车辆状态</text>
  <text x="1235" y="702" text-anchor="middle" class="node-sub">State = AUTO</text>

  <!-- Cloud-side nodes -->
  <rect x="130" y="875" width="305" height="80" rx="10" fill="#ffedd5" stroke="#f97316" class="card"/>
  <text x="282.5" y="907" text-anchor="middle" class="node-title">OpenAI-compatible API</text>
  <text x="282.5" y="932" text-anchor="middle" class="node-sub">POST /v1/chat/completions</text>

  <rect x="545" y="875" width="310" height="80" rx="10" fill="#fff7ed" stroke="#f97316" class="card"/>
  <text x="700" y="907" text-anchor="middle" class="node-title">Qwen3.5 9B</text>
  <text x="700" y="932" text-anchor="middle" class="node-sub">图像 + 检测信息联合决策</text>

  <rect x="965" y="875" width="325" height="80" rx="10" fill="#ffedd5" stroke="#f97316" class="card"/>
  <text x="1127.5" y="907" text-anchor="middle" class="node-title">左/右变道 JSON</text>
  <text x="1127.5" y="932" text-anchor="middle" class="node-sub">left/right → lane-left/lane-right</text>

  <!-- Edges: normal car loop -->
  <path d="M520 183 L520 201" class="flow-blue"/>
  <path d="M520 287 L520 321" class="flow-blue"/>
  <path d="M520 411 L520 451" class="flow-blue"/>
  <path d="M520 553 L520 584" class="flow-blue"/>
  <path d="M365 650 L344 650" class="flow-blue"/>
  <rect x="314" y="626" width="56" height="28" class="label-bg"/>
  <text x="342" y="646" text-anchor="middle" class="edge-label" fill="#2563eb">AUTO</text>
  <path d="M520 710 L520 721" class="flow-blue"/>
  <rect x="486" y="697" width="68" height="28" class="label-bg"/>
  <text x="520" y="717" text-anchor="middle" class="edge-label" fill="#2563eb">BRAKE</text>

  <!-- Edges: long-tail detection -->
  <path d="M655 368 L870 368" class="flow-amber"/>
  <rect x="705" y="344" width="110" height="28" class="label-bg"/>
  <text x="760" y="364" text-anchor="middle" class="edge-label" fill="#d97706">画面帧</text>

  <path d="M1042.5 420 L1042.5 459" class="flow-amber"/>
  <path d="M945 572 L928 641" class="flow-amber"/>
  <rect x="898" y="596" width="58" height="28" class="label-bg"/>
  <text x="927" y="616" text-anchor="middle" class="edge-label" fill="#d97706">是</text>

  <path d="M1140 572 L1232 641" class="flow-amber"/>
  <rect x="1166" y="596" width="58" height="28" class="label-bg"/>
  <text x="1195" y="616" text-anchor="middle" class="edge-label" fill="#d97706">否</text>

  <path d="M790 684 L674 655" class="flow-amber"/>
  <path d="M1110 684 L678 657" class="flow-amber"/>
  <rect x="708" y="632" width="110" height="28" class="label-bg"/>
  <text x="763" y="652" text-anchor="middle" class="edge-label" fill="#d97706">状态结果</text>

  <!-- Edges: cloud communication -->
  <path d="M927.5 723 C927.5 785 520 805 292 871" class="dash-orange"/>
  <rect x="514" y="780" width="220" height="30" class="label-bg"/>
  <text x="624" y="801" text-anchor="middle" class="edge-label" fill="#f97316">Base64 图片 + 检测分数</text>

  <path d="M435 915 L540 915" class="flow-orange"/>
  <path d="M855 915 L960 915" class="flow-orange"/>
  <path d="M1127.5 875 C1127.5 790 716 777 660 765" class="dash-orange"/>
  <rect x="805" y="762" width="170" height="30" class="label-bg"/>
  <text x="890" y="783" text-anchor="middle" class="edge-label" fill="#f97316">下发变道指令</text>

  <path d="M655 764 C1210 764 1290 520 1216 535" class="dash-amber"/>
  <rect x="1068" y="740" width="150" height="30" class="label-bg"/>
  <text x="1143" y="761" text-anchor="middle" class="edge-label" fill="#d97706">执行后重新检测</text>

  <!-- Compact legend -->
  <rect x="70" y="715" width="285" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <line x1="88" y1="734" x2="128" y2="734" stroke="#2563eb" stroke-width="4"/>
  <text x="140" y="740" class="small">车端正常闭环</text>
  <line x1="88" y1="754" x2="128" y2="754" stroke="#f97316" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="140" y="760" class="small">云端跨端通信</text>
</svg>
